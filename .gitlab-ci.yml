stages:
  - build_and_deploy_frontend

default:
  tags:
    - aura-runner


# ======================================================
# PLANTILLA COMUN FRONTEND
# ======================================================

.deploy_frontend:
  stage: build_and_deploy_frontend

  script:
    - set -euo pipefail

    - echo "========================================"
    - echo " AURA - BUILD FRONTEND"
    - echo " Entorno: ${DEPLOY_ENV}"
    - echo "========================================"

    - echo "=== Informacion del runner ==="
    - hostname
    - whoami
    - node -v
    - npm -v
    - rsync --version | head -1

    # ==================================================
    # Dependencias
    # ==================================================

    - echo "=== Limpiando build anterior ==="

    - rm -rf node_modules dist

    - echo "=== Instalando dependencias ==="

    - |
      if [ -f package-lock.json ]; then

        echo "Usando npm ci"
        npm ci --legacy-peer-deps

      else

        echo "No existe package-lock.json. Usando npm install"
        npm install --legacy-peer-deps

      fi

    # ==================================================
    # Build
    # ==================================================

    - echo "=== Compilando frontend ==="

    - npm run build

    - echo "=== Verificando build ==="

    - |
      if [ ! -f dist/index.html ]; then
        echo "ERROR: No existe dist/index.html"
        exit 1
      fi

    - ls -lh dist/index.html

    # ==================================================
    # SSH
    # ==================================================

    - echo "=== Comprobando SSH ${DEPLOY_ENV} ==="

    - |
      ssh \
        -o BatchMode=yes \
        -o ConnectTimeout=10 \
        "babenza@${DEPLOY_HOST}" \
        "echo SSH_OK && hostname"

    # ==================================================
    # Directorio temporal
    # ==================================================

    - echo "=== Preparando destino ${DEPLOY_ENV} ==="

    - |
      ssh \
        -o BatchMode=yes \
        -o ConnectTimeout=10 \
        "babenza@${DEPLOY_HOST}" \
        "rm -rf /tmp/aura-frontend && mkdir -p /tmp/aura-frontend"

    # ==================================================
    # Transferencia
    # ==================================================

    - echo "=== Copiando frontend a ${DEPLOY_ENV} ==="

    - |
      rsync \
        -az \
        --delete \
        -e "ssh -o BatchMode=yes -o ConnectTimeout=10" \
        dist/ \
        "babenza@${DEPLOY_HOST}:/tmp/aura-frontend/"

    # ==================================================
    # Deploy
    # ==================================================

    - echo "=== Ejecutando deploy frontend ${DEPLOY_ENV} ==="

    - |
      ssh \
        -o BatchMode=yes \
        -o ConnectTimeout=10 \
        "babenza@${DEPLOY_HOST}" \
        "bash /home/babenza/deploy_frontend.sh"

    # ==================================================
    # Health check
    # ==================================================

    - echo "=== Comprobando frontend ${DEPLOY_ENV} ==="

    - |
      HTTP_CODE="$(
        ssh \
          -o BatchMode=yes \
          -o ConnectTimeout=10 \
          "babenza@${DEPLOY_HOST}" \
          "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/"
      )"

      echo "HTTP ${DEPLOY_ENV} -> ${HTTP_CODE}"

      if [ "$HTTP_CODE" != "200" ]; then

        echo "ERROR: Frontend ${DEPLOY_ENV} devuelve HTTP ${HTTP_CODE}"

        exit 1
      fi

    - echo "========================================"
    - echo " FRONTEND ${DEPLOY_ENV} DESPLEGADO OK"
    - echo "========================================"


# ======================================================
# DES
# develop -> Raspberry DES
# LAN: 192.168.100.4:22
# ======================================================

deploy_frontend_DES:
  extends: .deploy_frontend

  variables:
    DEPLOY_ENV: "DES"
    DEPLOY_HOST: "192.168.100.4"

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'


# ======================================================
# PRE
# release -> Raspberry PRE
# LAN: 192.168.100.3:22
# ======================================================

deploy_frontend_PRE:
  extends: .deploy_frontend

  variables:
    DEPLOY_ENV: "PRE"
    DEPLOY_HOST: "192.168.100.3"

  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'


# ======================================================
# PRO
# main -> Raspberry PRO
# LAN: 192.168.100.2:22
# ======================================================

deploy_frontend_PRO:
  extends: .deploy_frontend

  variables:
    DEPLOY_ENV: "PRO"
    DEPLOY_HOST: "192.168.100.2"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'