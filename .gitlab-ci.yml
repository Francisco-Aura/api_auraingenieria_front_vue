stages:
  - build_and_deploy_frontend

default:
  tags:
    - aura-runner


# ======================================================
# PLANTILLA COMUN FRONTEND
# ======================================================

.deploy_frontend:
  stage: build_and_deploy_frontend

  script:
    - |
      set -euo pipefail

      echo "========================================"
      echo " AURA - BUILD FRONTEND"
      echo " Entorno: ${DEPLOY_ENV}"
      echo " Destino: ${DEPLOY_HOST}"
      echo "========================================"

      echo
      echo "=== Informacion del runner ==="
      hostname
      whoami
      node -v
      npm -v
      rsync --version | head -1

      # ==================================================
      # Limpieza
      # ==================================================

      echo
      echo "=== Limpiando build anterior ==="

      rm -rf node_modules
      rm -rf dist

      # ==================================================
      # Dependencias
      # ==================================================

      echo
      echo "=== Instalando dependencias ==="

      if [ -f package-lock.json ]; then
        echo "Usando npm ci"
        npm ci --legacy-peer-deps
      else
        echo "No existe package-lock.json. Usando npm install"
        npm install --legacy-peer-deps
      fi

      # ==================================================
      # Build
      # ==================================================

      echo
      echo "=== Compilando frontend ==="

      npm run build

      echo
      echo "=== Verificando build ==="

      if [ ! -f dist/index.html ]; then
        echo "ERROR: No existe dist/index.html"
        exit 1
      fi

      ls -lh dist/index.html

      # ==================================================
      # SSH
      # ==================================================

      echo
      echo "=== Comprobando SSH con ${DEPLOY_ENV} ==="

      ssh \
        -o BatchMode=yes \
        -o ConnectTimeout=10 \
        "babenza@${DEPLOY_HOST}" \
        "echo SSH_OK && hostname && whoami"

      # ==================================================
      # Directorio temporal remoto
      # ==================================================

      echo
      echo "=== Preparando destino temporal ${DEPLOY_ENV} ==="

      ssh \
        -o BatchMode=yes \
        -o ConnectTimeout=10 \
        "babenza@${DEPLOY_HOST}" \
        "rm -rf /tmp/aura-frontend && mkdir -p /tmp/aura-frontend"

      # ==================================================
      # Transferencia
      # ==================================================

      echo
      echo "=== Copiando frontend a ${DEPLOY_ENV} ==="

      rsync \
        -az \
        --delete \
        -e "ssh -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3" \
        dist/ \
        "babenza@${DEPLOY_HOST}:/tmp/aura-frontend/"

      # ==================================================
      # Deploy
      # ==================================================

      echo
      echo "=== Ejecutando deploy frontend ${DEPLOY_ENV} ==="

      ssh \
        -o BatchMode=yes \
        -o ConnectTimeout=10 \
        -o ServerAliveInterval=10 \
        -o ServerAliveCountMax=3 \
        "babenza@${DEPLOY_HOST}" \
        "bash /home/babenza/deploy_frontend.sh"

      # ==================================================
      # Health check
      # ==================================================

      echo
      echo "=== Comprobando frontend ${DEPLOY_ENV} ==="

      HTTP_CODE="$(
        ssh \
          -o BatchMode=yes \
          -o ConnectTimeout=10 \
          "babenza@${DEPLOY_HOST}" \
          "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/"
      )"

      echo "HTTP ${DEPLOY_ENV} -> ${HTTP_CODE}"

      if [ "$HTTP_CODE" != "200" ]; then
        echo "ERROR: Frontend ${DEPLOY_ENV} devuelve HTTP ${HTTP_CODE}"
        exit 1
      fi

      # ==================================================
      # Resultado
      # ==================================================

      echo
      echo "========================================"
      echo " FRONTEND ${DEPLOY_ENV} DESPLEGADO OK"
      echo "========================================"


# ======================================================
# DES
# develop -> aura-des
# 192.168.100.4
# ======================================================

deploy_frontend_DES:
  extends: .deploy_frontend

  variables:
    DEPLOY_ENV: "DES"
    DEPLOY_HOST: "192.168.100.4"

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'


# ======================================================
# PRE
# release -> aura-pre
# 192.168.100.3
# ======================================================

deploy_frontend_PRE:
  extends: .deploy_frontend

  variables:
    DEPLOY_ENV: "PRE"
    DEPLOY_HOST: "192.168.100.3"

  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'


# ======================================================
# PRO
# main -> aura-pro
# 192.168.100.2
# ======================================================

deploy_frontend_PRO:
  extends: .deploy_frontend

  variables:
    DEPLOY_ENV: "PRO"
    DEPLOY_HOST: "192.168.100.2"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'