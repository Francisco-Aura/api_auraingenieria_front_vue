```yaml
image: node:20

stages:
  - build_and_deploy_frontend

.deploy_frontend:
  stage: build_and_deploy_frontend

  before_script:
    - apt-get update -y
    - apt-get install -y openssh-client rsync

    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    - |
      if [ -f "$DEPLOY_PRIVATE_KEY" ]; then
        echo "Usando clave SSH desde variable GitLab tipo File"
        cp "$DEPLOY_PRIVATE_KEY" ~/.ssh/id_rsa_gitlab
      else
        echo "Usando clave SSH desde variable GitLab normal"
        printf '%s\n' "$DEPLOY_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa_gitlab
      fi

    - chmod 600 ~/.ssh/id_rsa_gitlab

    - |
      echo "=== Validando clave SSH ==="
      ssh-keygen -y -f ~/.ssh/id_rsa_gitlab > /dev/null || {
        echo "ERROR: La clave privada SSH no es valida"
        exit 1
      }

    - |
      echo "=== Registrando host SSH ==="
      ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

    - chmod 600 ~/.ssh/known_hosts

    - |
      echo "=== Probando conexion SSH ==="
      ssh \
        -p "$DEPLOY_PORT" \
        -i ~/.ssh/id_rsa_gitlab \
        -o BatchMode=yes \
        -o ConnectTimeout=10 \
        "gitlab-deploy@${DEPLOY_HOST}" \
        "echo SSH_OK && hostname && whoami"

  script:
    - echo "=== Instalando dependencias ==="
    - rm -rf node_modules dist

    - |
      if [ -f package-lock.json ]; then
        npm ci --legacy-peer-deps
      else
        npm install --legacy-peer-deps
      fi

    - echo "=== Compilando frontend ==="
    - npm run build

    - echo "=== Verificando build ==="
    - test -f dist/index.html

    - echo "=== Preparando despliegue remoto ==="
    - |
      ssh \
        -p "$DEPLOY_PORT" \
        -i ~/.ssh/id_rsa_gitlab \
        -o BatchMode=yes \
        "gitlab-deploy@${DEPLOY_HOST}" \
        "rm -rf /tmp/aura-frontend && mkdir -p /tmp/aura-frontend"

    - echo "=== Enviando frontend ==="
    - |
      rsync \
        -avz \
        --delete \
        -e "ssh -p ${DEPLOY_PORT} -i ~/.ssh/id_rsa_gitlab" \
        dist/ \
        "gitlab-deploy@${DEPLOY_HOST}:/tmp/aura-frontend/"

    - echo "=== Instalando frontend ==="
    - |
      ssh \
        -p "$DEPLOY_PORT" \
        -i ~/.ssh/id_rsa_gitlab \
        -o BatchMode=yes \
        "gitlab-deploy@${DEPLOY_HOST}" \
        "sudo -n /usr/local/sbin/aura-deploy-frontend"


# ======================================================
# DES
# develop -> Raspberry DES
# SSH -> 5.34.148.92:2223
# WEB -> http://5.34.148.92:8081
# ======================================================

deploy_frontend_DES:
  extends: .deploy_frontend

  variables:
    DEPLOY_HOST: "5.34.148.92"
    DEPLOY_PORT: "2223"
    DEPLOY_PRIVATE_KEY: "$SSH_PRIVATE_KEY_DES"

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'


# ======================================================
