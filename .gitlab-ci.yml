# En la raíz de tu proyecto frontend
image: node:20

stages:
  - build_and_deploy_frontend

deploy_frontend_job:
  stage: build_and_deploy_frontend
  only:
    - main

  script:
    # ... (Instalación de dependencias y build de Vue - todo igual) ...

    # 3. Configurar SSH usando ssh-agent (igual)
    - echo "Configurando SSH con ssh-agent..."
    - apt-get update -y && apt-get install -y openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -

    # 4. Añadir la huella digital del servidor (known_hosts) (igual)
    - mkdir -p ~/.ssh
    - ssh-keyscan 5.34.149.250 >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts

    # === AJUSTE CRÍTICO AQUÍ: Cambiamos el directorio temporal a la home del usuario ===
    - export REMOTE_TMP_DIR="/home/babenza/tmp_vue_build" # Nueva variable para el directorio temporal
    - echo "Creando o asegurando la existencia del directorio temporal ${REMOTE_TMP_DIR} en la Raspberry Pi..."
    - ssh -o StrictHostKeyChecking=no babenza@5.34.149.250 "mkdir -p ${REMOTE_TMP_DIR}"

    # 5. Limpiar el directorio temporal remoto antes de copiar (opcional, pero buena práctica)
    - echo "Limpiando contenido antiguo del directorio temporal remoto..."
    - ssh -o StrictHostKeyChecking=no babenza@5.34.149.250 "rm -rf ${REMOTE_TMP_DIR}/*"


    # 6. Copiar los archivos construidos (de la carpeta 'dist') al directorio temporal en la Raspberry Pi
    - echo "Copiando archivos del frontend a ${REMOTE_TMP_DIR} en la Raspberry Pi..."
    - scp -r -o StrictHostKeyChecking=no dist/. babenza@5.34.149.250:"${REMOTE_TMP_DIR}/" # Copia el contenido de dist/
    - scp -r -o StrictHostKeyChecking=no dist/.* babenza@5.34.149.250:"${REMOTE_TMP_DIR}/" 2>/dev/null # Para archivos ocultos

    # 7. Ejecutar el script de despliegue del frontend en la Raspberry Pi
    # IMPORTANTE: Tu script deploy_frontend.sh en la RPi debe saber dónde buscar los archivos.
    # Necesitamos pasarle el directorio temporal o ajustarlo.
    # La forma más fácil es cambiar BUILD_DIR en deploy_frontend.sh
    # O, pasarle el directorio como argumento:
    - echo "Ejecutando script de despliegue en la Raspberry Pi..."
    - ssh -o StrictHostKeyChecking=no babenza@5.34.149.250 "bash /home/babenza/deploy_frontend.sh ${REMOTE_TMP_DIR}"

  cache:
    paths:
      - node_modules/