image: node:20

stages:
  - build_and_deploy_frontend

.deploy_frontend:
  stage: build_and_deploy_frontend

  before_script:
    - apt-get update -y
    - apt-get install -y openssh-client rsync
    - eval "$(ssh-agent -s)"
    - printf '%s\n' "$DEPLOY_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts

  script:
    - set -eo pipefail

    - echo "=== Instalando dependencias ==="
    - rm -rf node_modules dist

    - |
      if [ -f package-lock.json ]; then
        npm ci --legacy-peer-deps
      else
        npm install --legacy-peer-deps
      fi

    - echo "=== Compilando frontend ==="
    - npm run build

    - test -f dist/index.html

    - echo "=== Preparando despliegue remoto ==="
    - ssh
      -p "$DEPLOY_PORT"
      "babenza@${DEPLOY_HOST}"
      "rm -rf /tmp/aura-frontend && mkdir -p /tmp/aura-frontend"

    - echo "=== Enviando frontend ==="
    - rsync
      -avz
      --delete
      -e "ssh -p ${DEPLOY_PORT}"
      dist/
      "babenza@${DEPLOY_HOST}:/tmp/aura-frontend/"

    - echo "=== Instalando frontend ==="
    - ssh
      -p "$DEPLOY_PORT"
      "babenza@${DEPLOY_HOST}"
      "bash /home/babenza/deploy_frontend.sh"


# ======================================================
# DES
# ======================================================

deploy_frontend_DES:
  extends: .deploy_frontend

  variables:
    DEPLOY_HOST: "5.34.148.92"
    DEPLOY_PORT: "2223"
    DEPLOY_PRIVATE_KEY: "$SSH_PRIVATE_KEY_DES"

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'


# ======================================================
