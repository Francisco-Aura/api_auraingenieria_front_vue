# Node 22 (LTS): Node 20 dejó de tener soporte en abril de 2026
image: node:22

stages:
  - build_and_deploy_frontend

# ============================
# Despliegue FRONTEND en PRE
# (Rama release → Raspberry PRE)
# SSH: 2222
# WEB: http://5.34.148.92:8080
# ============================
deploy_frontend_PRE:
  stage: build_and_deploy_frontend
  only:
    - release

  script:
    - set -eo pipefail

    - echo "Limpiando entorno anterior..."
    - rm -rf node_modules dist

    - echo "Instalando dependencias (versiones exactas del package-lock.json)..."
    - npm ci --no-audit --no-fund

    - echo "Verificando instalación..."
    - npm list --depth=0 || true

    - echo "Pasando los tests (si falla alguno no se despliega)..."
    - npm test

    - echo "Construyendo aplicación..."
    - npm run build

    - chmod -R 755 dist

    - apt-get update -y
    - apt-get install -y openssh-client rsync

    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_PRE" | ssh-add -

    - mkdir -p ~/.ssh
    - ssh-keyscan -p 2222 5.34.148.92 >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts

    - export FRONTEND_FINAL_DIR="/home/babenza/deploy/frontend"

    - ssh -p 2222 -o StrictHostKeyChecking=no babenza@5.34.148.92 "mkdir -p ${FRONTEND_FINAL_DIR}"

    # Sin vaciar antes la carpeta (la web dejaba de responder mientras se subía): los
    # ficheros nuevos se colocan todos juntos al final y luego se borran los que sobran
    # Nunca se publica una web vacía: rsync --delete-after borraría la que hay
    - test -s dist/index.html
    - rsync -avzh --delete-after --delay-updates --progress -e "ssh -p 2222 -o StrictHostKeyChecking=no" dist/ babenza@5.34.148.92:${FRONTEND_FINAL_DIR}/

    - ssh -p 2222 -o StrictHostKeyChecking=no babenza@5.34.148.92 "bash /home/babenza/deploy_frontend.sh"


