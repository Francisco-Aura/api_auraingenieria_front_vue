image: node:20

stages:
  - build_and_deploy_frontend

# ============================
# Despliegue FRONTEND en PRE
# (Rama release → Raspberry PRE)
# ============================
deploy_frontend_PRE:
  stage: build_and_deploy_frontend
  only:
    - release
  script:
    - set -eo pipefail
    - set -x
    ########################################
    # CLEAN
    ########################################
    - echo "Limpiando entorno anterior..."
    - rm -rf node_modules package-lock.json dist
    - npm cache clean --force

    ########################################
    # ENV
    ########################################
    - echo "Configurando .env PRE..."
    - echo "VUE_APP_API_URL=" > .env
    - cat .env

    ########################################
    # INSTALL
    ########################################
    - echo "Instalando dependencias..."
    - npm install --legacy-peer-deps

    ########################################
    # BUILD
    ########################################
    - echo "Construyendo aplicación Vue..."
    - npm run build

    ########################################
    # VERIFY
    ########################################
    - echo "Verificando que NO existan IPs hardcodeadas..."
    - |
      if grep -Rq "5.34." dist/; then
        echo "ERROR: Se encontraron IPs hardcodeadas en el build"
        exit 1
      else
        echo "OK: No hay IPs hardcodeadas"
      fi

    - echo "Verificando que NO exista /api/api..."
    - |
      if grep -Rq "/api/api" dist/; then
        echo "ERROR: Encontrado /api/api en build"
        exit 1
      else
        echo "OK: No existe /api/api"
      fi

    ########################################
    # SSH
    ########################################
    - echo "Configurando SSH..."
    - apt-get update -y
    - apt-get install -y openssh-client rsync

    - eval $(ssh-agent -s)

    - echo "$SSH_PRIVATE_KEY_PRE" | tr -d '\r' | ssh-add -

    - mkdir -p ~/.ssh

    - ssh-keyscan 5.34.148.92 >> ~/.ssh/known_hosts

    - chmod 600 ~/.ssh/known_hosts

    ########################################
    # DEPLOY
    ########################################
    - export FRONTEND_FINAL_DIR="/home/babenza/deploy/frontend"

    - echo "Preparando directorio remoto..."
    - |
      ssh -o StrictHostKeyChecking=no babenza@5.34.148.92 "
        mkdir -p ${FRONTEND_FINAL_DIR} &&
        rm -rf ${FRONTEND_FINAL_DIR}/*
      "

    - echo "Copiando frontend..."
    - |
      rsync -avzh \
        --delete \
        --progress \
        -e "ssh -o StrictHostKeyChecking=no" \
        dist/ \
        babenza@5.34.148.92:${FRONTEND_FINAL_DIR}/

    ########################################
    # POST DEPLOY
    ########################################
    - echo "Ejecutando post deploy..."
    - |
      ssh -o StrictHostKeyChecking=no babenza@5.34.148.92 "
        bash /home/babenza/deploy_frontend.sh
      "

    ########################################
    # DONE
    ########################################
    - echo "DEPLOY PRE COMPLETADO"


