image: node:20

stages:
  - build_and_deploy_frontend

deploy_frontend_job:
  stage: build_and_deploy_frontend
  only:
    - release

  script:
    - set -eo pipefail
    - set -x

    - echo "Instalando dependencias de Node.js..."
    - npm install --production=false --ci

    - echo "Construyendo la aplicación Vue..."
    - npm run build

    - echo "--- Contenido del directorio de trabajo actual después del build ---"
    - ls -la .
    - echo "--- Contenido de la carpeta 'dist/' (si existe) ---"
    - ls -la dist/ || echo "Directorio dist/ no encontrado o vacío."
    - echo "Ajustando permisos de la carpeta dist/ para rsync..."
    - chmod -R 777 dist/ || echo "No se pudo cambiar permisos de dist/ (podría no existir o ser vacío)"

    - echo "Configurando SSH con ssh-agent..."
    - apt-get update -y && apt-get install -y openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_PRE" | ssh-add -

    - mkdir -p ~/.ssh
    - ssh-keyscan 5.34.148.92 >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts

    - echo "Instalando rsync en el runner..."
    - apt-get install -y rsync

    - export FRONTEND_FINAL_DIR="/home/babenza/deploy/frontend"
    - echo "Asegurando la existencia del directorio final ${FRONTEND_FINAL_DIR} en la Raspberry Pi PRE..."
    - ssh -o StrictHostKeyChecking=no babenza@5.34.148.92 "mkdir -p ${FRONTEND_FINAL_DIR}"

    - echo "Copiando archivos del frontend directamente a ${FRONTEND_FINAL_DIR} en la Raspberry Pi PRE usando rsync..."
    - rsync -avzh --delete -e "ssh -o StrictHostKeyChecking=no" dist/ babenza@5.34.148.92:"${FRONTEND_FINAL_DIR}/"

    - echo "Ejecutando script de post-despliegue en la Raspberry Pi PRE (ajustando permisos y recargando Nginx)..."
    - ssh -o StrictHostKeyChecking=no babenza@5.34.148.92 "bash /home/babenza/deploy_frontend.sh"

  cache:
    paths:
      - node_modules/
