image: node:20

stages:
  - build_and_deploy_frontend

# ============================
# Despliegue FRONTEND en PRE
# (Rama release → Raspberry PRE)
# ============================
deploy_frontend_PRE:
  stage: build_and_deploy_frontend
  only:
    - release
  script:
    - set -eo pipefail
    - set -x

    # 1. Limpiar entorno completamente
    - echo "Limpiando entorno anterior..."
    - rm -rf node_modules/ package-lock.json
    - npm cache clean --force

    # 2. Instalar dependencias limpias
    - echo "Instalando dependencias de Node.js..."
    - npm install --legacy-peer-deps

    # 3. Verificar instalación
    - echo "Verificando instalación..."
    - npm list --depth=0
    - npm audit || echo "Audit completado con warnings"

    # 4. Construir la app Vue
    - echo "Construyendo la aplicación Vue..."
    - npm run build

    # Debug build mejorado
    - echo "--- Contenido del directorio actual ---"
    - ls -la .
    - echo "--- Contenido de dist/ ---"
    - ls -la dist/ || echo "Directorio dist/ no encontrado"
    - echo "--- Tamaño de dist/ ---"
    - du -sh dist/ || echo "No se pudo calcular tamaño"
    - chmod -R 755 dist/ || echo "No se pudo cambiar permisos de dist"

    # 5. Configurar SSH
    - echo "Configurando SSH con ssh-agent..."
    - apt-get update -y && apt-get install -y openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_PRE" | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan 5.34.148.92 >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts

    # 6. Instalar rsync
    - echo "Instalando rsync en el runner..."
    - apt-get install -y rsync

    # 7. Directorio destino en Raspberry PRE
    - export FRONTEND_FINAL_DIR="/home/babenza/deploy/frontend"
    - ssh -o StrictHostKeyChecking=no babenza@5.34.148.92 "mkdir -p ${FRONTEND_FINAL_DIR} && rm -rf ${FRONTEND_FINAL_DIR}/*"

    # 8. Copiar archivos con rsync
    - echo "Copiando archivos frontend a PRE..."
    - rsync -avzh --delete --progress -e "ssh -o StrictHostKeyChecking=no" dist/ babenza@5.34.148.92:"${FRONTEND_FINAL_DIR}/"

    # 9. Verificar despliegue
    - echo "Verificando archivos desplegados..."
    - ssh -o StrictHostKeyChecking=no babenza@5.34.148.92 "ls -la ${FRONTEND_FINAL_DIR}/ && du -sh ${FRONTEND_FINAL_DIR}/"

    # 10. Ejecutar script de post-despliegue
    - echo "Ejecutando script post-despliegue en PRE..."
    - ssh -o StrictHostKeyChecking=no babenza@5.34.148.92 "bash /home/babenza/deploy_frontend.sh"

  # Eliminar cache para forzar instalación limpia
  # cache:
  #   paths:
  #     - node_modules/

